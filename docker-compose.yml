services:
  # PostgreSQL Database Engine
  db:
    image: postgres:16-alpine
    container_name: lifevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lifevault_db}
      POSTGRES_USER: ${DB_USER:-vault_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault_user} -d ${DB_NAME:-lifevault_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: Asynchronous task broker & cache
  redis:
    image: redis:7-alpine
    container_name: lifevault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend Application
  backend:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    container_name: lifevault-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-4bKC6NVatHKMedjJLRwbsReN0tj2clIXqn2Aa4hRVNqlFjRVVh0tCM60HKbN-uaYJMw}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
      DB_ENGINE: "postgresql"
      DB_NAME: ${DB_NAME:-lifevault_db}
      DB_USER: ${DB_USER:-vault_user}
      DB_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
      DB_HOST: "db"
      DB_PORT: "5432"
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-E+k+JHvSzIG4COx/Rch3yGPGJFzT6uv6YWW8HWfnFFs=}
      VAULT_STORAGE_ROOT: "/app/storage/private"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - vault_storage:/app/storage/private
    ports:
      - "8000:8000"

  # Celery Asynchronous & Scheduled Worker
  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    container_name: lifevault-celery
    restart: unless-stopped
    command: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency", "2"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-4bKC6NVatHKMedjJLRwbsReN0tj2clIXqn2Aa4hRVNqlFjRVVh0tCM60HKbN-uaYJMw}
      DJANGO_DEBUG: "False"
      DB_ENGINE: "postgresql"
      DB_NAME: ${DB_NAME:-lifevault_db}
      DB_USER: ${DB_USER:-vault_user}
      DB_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
      DB_HOST: "db"
      DB_PORT: "5432"
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-E+k+JHvSzIG4COx/Rch3yGPGJFzT6uv6YWW8HWfnFFs=}
      VAULT_STORAGE_ROOT: "/app/storage/private"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - vault_storage:/app/storage/private

  # Celery Beat Periodic Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    container_name: lifevault-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    depends_on:
      celery_worker:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-4bKC6NVatHKMedjJLRwbsReN0tj2clIXqn2Aa4hRVNqlFjRVVh0tCM60HKbN-uaYJMw}
      DJANGO_DEBUG: "False"
      DB_ENGINE: "postgresql"
      DB_NAME: ${DB_NAME:-lifevault_db}
      DB_USER: ${DB_USER:-vault_user}
      DB_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
      DB_HOST: "db"
      DB_PORT: "5432"
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-E+k+JHvSzIG4COx/Rch3yGPGJFzT6uv6YWW8HWfnFFs=}
      VAULT_STORAGE_ROOT: "/app/storage/private"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  # React Frontend (Nginx Proxy)
  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend/Dockerfile
    container_name: lifevault-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  vault_storage:
